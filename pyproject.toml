[project]
name = "signage-studio"
version = "0.1.0"
description = "店頭サイネージ動画の自動編集ツール"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10",
    "pydantic>=2.7",
    # 文字起こし: Mac は Apple Silicon 向け、Windows は CPU 向け
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.1; sys_platform != 'darwin'",
    "nicegui>=2.10",
    "pywebview>=5.3 ; sys_platform != 'linux'",
]

[dependency-groups]
dev = [
    "fonttools>=4.68.0",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
